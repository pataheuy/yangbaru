<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pufutara Launcher</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pufutara: {
              50: '#f9f9f9',
              100: '#f0f0f0',
              800: '#1a1a1a',
              900: '#111111',
              950: '#0a0a0a',
            }
          }
        }
      }
    };
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-white dark:bg-pufutara-950 text-pufutara-900 dark:text-pufutara-50 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header / Navigation -->
  <header class="border-b border-gray-200 dark:border-neutral-800 px-6 py-4 flex items-center justify-between sticky top-0 z-20 bg-white/90 dark:bg-pufutara-950/90 backdrop-blur-md">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-black dark:bg-white text-white dark:text-black rounded-lg flex items-center justify-center font-bold text-xl shadow-sm">
        P
      </div>
      <div>
        <h1 class="font-bold text-base leading-none tracking-tight">pufutara</h1>
        <span class="text-[10px] text-gray-500 dark:text-neutral-400 font-medium tracking-wider uppercase">Digital Ecosystem</span>
      </div>
    </div>

    <div class="flex items-center space-x-6">
      <!-- Live Clock & Date -->
      <div class="text-right hidden sm:block">
        <div id="liveClock" class="text-sm font-semibold tracking-wide">00:00:00</div>
        <div id="liveDate" class="text-xs text-gray-500 dark:text-neutral-400">Senin, 1 Jan 2026</div>
      </div>

      <!-- Minimalist Theme Switcher Dropdown -->
      <div class="relative flex items-center">
        <select 
          id="themeSelect" 
          class="appearance-none bg-gray-100/80 dark:bg-neutral-800/80 hover:bg-gray-200/80 dark:hover:bg-neutral-700/80 text-gray-700 dark:text-neutral-300 text-[11px] font-semibold rounded-full py-1.5 pl-3.5 pr-8 outline-none cursor-pointer transition-all border border-transparent focus:border-gray-300 dark:focus:border-neutral-600"
        >
          <option value="auto" class="bg-white dark:bg-neutral-900 text-gray-900 dark:text-white">Auto</option>
          <option value="light" class="bg-white dark:bg-neutral-900 text-gray-900 dark:text-white">Terang</option>
          <option value="dark" class="bg-white dark:bg-neutral-900 text-gray-900 dark:text-white">Gelap</option>
        </select>
        <i data-lucide="sun-moon" class="w-3.5 h-3.5 absolute right-3 pointer-events-none text-gray-400 dark:text-neutral-500"></i>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-10 flex flex-col items-center">
    
    <!-- Hero Section -->
    <div class="text-center max-w-2xl mb-8">
      <h2 class="text-3xl font-extrabold tracking-tight sm:text-4xl">
        Pufutara Workspace Portal
      </h2>
      <p class="mt-2 text-sm text-gray-600 dark:text-neutral-400">
        Pusat kendali & peluncur aplikasi ekosistem digital Pufutara.
      </p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="w-full max-w-2xl space-y-4 mb-8">
      
      <!-- Search Input Box -->
      <div class="relative flex items-center shadow-sm">
        <i data-lucide="search" class="absolute left-4 w-5 h-5 text-gray-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari aplikasi atau tekan Enter untuk cari di web..." 
          class="w-full pl-12 pr-20 py-3.5 bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white transition-all"
        />
        <button 
          id="btnWebSearch" 
          title="Cari di Google Web" 
          class="absolute right-2 px-3 py-1.5 bg-black dark:bg-white text-white dark:text-black text-xs font-semibold rounded-lg hover:opacity-80 transition"
        >
          Web
        </button>
      </div>

      <!-- Category Dropdown Filter -->
      <div class="flex items-center justify-between text-xs text-gray-500 dark:text-neutral-400 px-1">
        <span class="font-medium flex items-center space-x-1.5">
          <i data-lucide="filter" class="w-3.5 h-3.5"></i>
          <span>Filter Kategori:</span>
        </span>
        <select 
          id="categoryDropdown" 
          class="bg-gray-100 dark:bg-neutral-800 text-gray-900 dark:text-gray-100 font-medium px-3 py-1.5 rounded-lg border border-gray-200 dark:border-neutral-700 outline-none cursor-pointer transition"
        >
          <!-- Auto-populated via JS -->
        </select>
      </div>

    </div>

    <!-- Stats Counter -->
    <div class="w-full flex items-center justify-between mb-2 border-b border-gray-100 dark:border-neutral-800 pb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Ekosistem Aplikasi</span>
      <span id="appCount" class="text-xs font-semibold text-gray-500 dark:text-neutral-400">0 Aplikasi</span>
    </div>

    <!-- Grouped Apps Sections Container -->
    <div id="appsSectionsContainer" class="w-full space-y-6">
      <!-- Dynamic Category Sections Rendered Here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 w-full">
      <i data-lucide="search-x" class="w-12 h-12 mx-auto text-gray-300 dark:text-neutral-700 mb-3"></i>
      <p class="text-sm font-medium text-gray-500 dark:text-neutral-400">Aplikasi tidak ditemukan.</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 dark:border-neutral-800 py-6 text-center text-xs text-gray-400 dark:text-neutral-600">
    <p>pufutara launcher &bull; Digital Ecosystem Portal</p>
  </footer>

  <script>

      },

      {

        icon: 'sparkles',
        category: 'Kreativitas & Konten',

      },
      {
        id: 'pf-propaint',
        title: 'Pufutara ProPaint',
        url: 'https://pufutara.vercel.app/paint/index.html',
        icon: 'palette',
        category: 'Kreativitas & Konten',

      },
      {

      // --- PRODUKTIVITAS & EDUKASI ---
      {

      {

      {

      // --- TOOLS & UTILITAS ---
      {

      },
      {

      },

      },
      {

        category: 'Tools & Utilitas',
        description: 'Arah kiblat digital dari mana saja. Panduan ibadah praktis untuk santri developer.'
      },
      {
        id: 'pf-workspace',
        title: 'Pufutara Workspace',
        url: '/work/index.html',
        icon: 'briefcase',
        category: 'Tools & Utilitas',
        description: 'Hub pusat aplikasi produktivitas Pufutara, gabungan dari berbagai proyek jadi satu.'
      },
      {
        id: 'pf-kiblat',
        title: 'Pufutara Kiblat',
        url: '/kiblat/index.html',
        icon: 'compass',
        category: 'Tools & Utilitas',
        description: 'Arah kiblat digital dari mana saja. Panduan ibadah praktis untuk santri developer.'
      },

      // --- FUN & HIBURAN ---
      {
        id: 'pf-calc',
        title: 'Pufutara Calc Pro',
        url: '/calc/index.html',
        icon: 'calculator',
        category: 'Fun & Hiburan',
        description: 'Kalkulator modern dengan fungsi sains, persentase, dan riwayat perhitungan.'
      },
      {
        id: 'pf-minigames',
        title: 'Pufutara MiniGames',
        url: '/game/index.html',
        icon: 'gamepad-2',
        category: 'Fun & Hiburan',
        description: 'Kumpulan game ringan buat refreshing otak setelah pusing ngurusin bug di HTML.'
      },
      {
        id: 'pf-webv1',
        title: 'Pufutara Web V1',
        url: 'https://kanay.vercel.app',
        icon: 'history',
        category: 'Fun & Hiburan',
        description: 'Saksi bisu perjalanan di BEM. Tanya anak BEM se-Sikma kalau mau tau sejarah web ini!'
      },
      {
        id: 'pf-webv2',
        title: 'Pufutara Web V2',
        url: 'https://pufuta.vercel.app',
        icon: 'globe',
        category: 'Fun & Hiburan',
        description: "Website utama Putra versi terbaru. Modern, cepat, dan pastinya tetap 'putraganteng'."
      },
      {
        id: 'pf-launcher',
        title: 'Pufutara Launcher',
        url: '/launcher/index.html',
        icon: 'rocket',
        category: 'Fun & Hiburan',
        description: 'Pusat kendali & peluncur semua aplikasi ekosistem digital Pufutara dalam satu halaman.'
      }
    ];

    // Category Icons Mapping for Divider Badges
    const CATEGORY_ICONS = {
      'Platform Pufutara': 'layers',
      'Kreativitas & Konten': 'palette',
      'Produktivitas & Edukasi': 'book-open-check',
      'Tools & Utilitas': 'wrench',
      'Fun & Hiburan': 'gamepad-2'
    };

    // State Variables
    let currentCategory = 'Semua';
    let searchQuery = '';

    // DOM Elements
    const appsSectionsContainer = document.getElementById('appsSectionsContainer');
    const emptyState = document.getElementById('emptyState');
    const appCount = document.getElementById('appCount');
    const searchInput = document.getElementById('searchInput');
    const btnWebSearch = document.getElementById('btnWebSearch');
    const categoryDropdown = document.getElementById('categoryDropdown');
    const themeSelect = document.getElementById('themeSelect');

    // Populate Category Dropdown Dynamically
    function populateCategoryDropdown() {
      const categories = ['Semua', ...new Set(APPS_DATA.map(app => app.category))];
      categoryDropdown.innerHTML = categories.map(cat => `
        <option value="${cat}">${cat === 'Semua' ? 'Semua Kategori' : cat}</option>
      `).join('');
    }

    // Live Clock Function
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Theme Management
    function applyTheme(mode) {
      if (mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    themeSelect.addEventListener('change', (e) => {
      const mode = e.target.value;
      localStorage.setItem('pufutara_theme', mode);
      applyTheme(mode);
    });

    // Initialize Saved Theme
    const savedTheme = localStorage.getItem('pufutara_theme') || 'auto';
    themeSelect.value = savedTheme;
    applyTheme(savedTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (themeSelect.value === 'auto') applyTheme('auto');
    });

    // Render Apps Grid with Category Dividers
    function renderApps() {
      // Filter items
      const filtered = APPS_DATA.filter(app => {
        const matchesCategory = currentCategory === 'Semua' || app.category === currentCategory;
        const matchesSearch = app.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              app.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      appCount.textContent = `${filtered.length} Aplikasi`;

      if (filtered.length === 0) {
        appsSectionsContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Group filtered apps by category
      const categoriesMap = {};
      filtered.forEach(app => {
        if (!categoriesMap[app.category]) {
          categoriesMap[app.category] = [];
        }
        categoriesMap[app.category].push(app);
      });

      // Build HTML with Category Dividers
      let htmlContent = '';

      Object.keys(categoriesMap).forEach(catName => {
        const catApps = categoriesMap[catName];
        const catIcon = CATEGORY_ICONS[catName] || 'folder';

        htmlContent += `
          <div class="category-section pt-2">
            <!-- Category Section Divider -->
            <div class="relative flex py-4 items-center">
              <div class="flex-grow border-t border-gray-200/80 dark:border-neutral-800"></div>
              <span class="flex-shrink mx-4 px-4 py-1.5 bg-gray-100/90 dark:bg-neutral-800/90 text-gray-700 dark:text-neutral-300 text-xs font-semibold rounded-full border border-gray-200 dark:border-neutral-700/70 flex items-center gap-2 shadow-sm">
                <i data-lucide="${catIcon}" class="w-3.5 h-3.5 text-black dark:text-white"></i>
                <span>${catName}</span>
              </span>
              <div class="flex-grow border-t border-gray-200/80 dark:border-neutral-800"></div>
            </div>

            <!-- Apps Grid for this Category -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-2">
              ${catApps.map(app => `
                <a 
                  href="${app.url}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="group flex flex-col items-center text-center p-4 rounded-2xl bg-gray-50/60 dark:bg-neutral-900/60 hover:bg-gray-100 dark:hover:bg-neutral-800 border border-gray-100 dark:border-neutral-800/80 hover:border-gray-300 dark:hover:border-neutral-700 transition-all duration-200 hover:-translate-y-1 shadow-sm"
                >
                  <div class="w-14 h-14 rounded-2xl bg-white dark:bg-neutral-800 border border-gray-200/80 dark:border-neutral-700/80 flex items-center justify-center mb-3 group-hover:scale-105 group-hover:shadow-md transition-all">
                    <i data-lucide="${app.icon || 'globe'}" class="w-7 h-7 text-pufutara-900 dark:text-pufutara-50"></i>
                  </div>
                  <h3 class="font-bold text-sm text-gray-900 dark:text-white group-hover:text-black dark:group-hover:text-white transition line-clamp-1 w-full">
                    ${app.title}
                  </h3>
                  <p class="text-[11px] text-gray-500 dark:text-neutral-400 mt-1 line-clamp-2 leading-snug font-normal w-full">
                    ${app.description}
                  </p>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      });

      appsSectionsContainer.innerHTML = htmlContent;
      lucide.createIcons();
    }

    // Event Listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderApps();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchQuery) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
      }
    });

    btnWebSearch.addEventListener('click', () => {
      if (searchQuery) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
      } else {
        searchInput.focus();
      }
    });

    categoryDropdown.addEventListener('change', (e) => {
      currentCategory = e.target.value;
      renderApps();
    });

    // Initial Setup
    populateCategoryDropdown();
    renderApps();
  </script>
</body>
</html>
