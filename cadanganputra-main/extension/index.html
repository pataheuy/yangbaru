<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tersimpan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    /* ── Auth Overlay ── */
    #auth-overlay {
      position: fixed; inset: 0;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
    }

    .auth-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
    }

    .auth-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .auth-card p  { font-size: 12px; color: #888; margin-bottom: 20px; line-height: 1.5; }

    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fafafa;
      transition: border-color .15s, background .15s;
    }
    .input-wrap input:focus { border-color: #111; background: #fff; }

    .toggle-pw {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; color: #bbb;
      display: flex; align-items: center; padding: 0;
    }
    .toggle-pw svg {
      width: 16px; height: 16px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .toggle-pw:hover { color: #555; }

    #auth-error {
      color: #e53e3e;
      font-size: 11px;
      margin-bottom: 10px;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { background: #333; }
    .btn-login:disabled { background: #999; cursor: not-allowed; }

    .spinner-sm {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Topbar ── */
    .topbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #f0f0f0;
      color: #111;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .btn-sm {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fafafa;
      color: #333;
      transition: background .15s, border-color .15s;
    }
    .btn-sm:hover  { background: #efefef; border-color: #bbb; }
    .btn-sm.danger { color: #e53e3e; border-color: #fca5a5; background: #fff5f5; }
    .btn-sm.danger:hover { background: #fee2e2; }

    /* ── Content ── */
    .content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 32px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 9px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #111; }
    .filter-select {
      padding: 9px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: #fff;
      cursor: pointer;
      color: #333;
    }

    /* ── Table ── */
    .table-wrap {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead {
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
    }
    th {
      text-align: left;
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f3f3;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .site-cell { display: flex; align-items: center; gap: 10px; }
    .favicon {
      width: 18px; height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .site-name { font-weight: 600; color: #111; }

    .pass-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      min-width: 220px;
    }
    .pass-val { color: #444; letter-spacing: 1px; }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #999;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .btn-icon:hover     { color: #111; background: #f0f0f0; }
    .btn-icon.del:hover { color: #e53e3e; background: #fff5f5; }

    .date-text { font-size: 12px; color: #888; white-space: nowrap; }

    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .state-box p:first-child { font-size: 15px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .state-box p:last-child  { font-size: 13px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #111;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── User chip ── */
    .user-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #555;
      padding: 4px 10px;
      background: #f5f5f5;
      border-radius: 20px;
      border: 1px solid #e5e5e5;
    }
    .user-chip span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Auth Overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Daftar Akun</h2>
      <p>Masukkan kredensial untuk melihat akun tersimpan.</p>


      <div class="input-group">
        <label>Email</label>
        <div class="input-wrap">
          <input type="email" id="auth-email" placeholder="email@contoh.com"
                 autofocus autocomplete="email" />
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="auth-input" placeholder="Password..."
                 autocomplete="current-password" />
          <button class="toggle-pw" id="toggle-pw" type="button" aria-label="Tampilkan password">
            <svg id="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="auth-error">Email atau password salah.</div>

      <button class="btn-login" id="auth-btn">
        <div class="spinner-sm" id="auth-spinner"></div>
        <span id="auth-btn-text">Masuk</span>
      </button>
    </div>
  </div>

  <!-- Topbar (tersembunyi sebelum login) -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="topbar-left">
      <div class="topbar-title">
        Akun Tersimpan
        <span class="badge" id="total-badge">0</span>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="user-chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="user-email-display">—</span>      </div>
      <button class="btn-sm" id="btn-refresh">↺ Refresh</button>
      <button class="btn-sm danger" id="btn-delete-all">Hapus Semua</button>
      <button class="btn-sm" id="btn-logout">Keluar</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="main-content" style="display:none">
    <div class="toolbar">
      <input type="text" class="search-input" id="search" placeholder="Cari situs atau username..." />
      <select class="filter-select" id="filter-site">
        <option value="">Semua Situs</option>
      </select>
    </div>

    <div class="table-wrap">
      <div id="loading-state" class="state-box">
        <p>Memuat data...</p>
        <p>Mohon tunggu sebentar</p>
      </div>
      <div id="empty-state" class="state-box" style="display:none">
        <p>Belum ada akun tersimpan</p>
        <p>Data akan muncul setelah login di situs manapun.</p>
      </div>
      <table id="data-table" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>Situs</th>
            <th>Username / Email</th>
            <th>Password</th>
            <th>Tanggal &amp; Jam</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

<script>
  // ─────────────────────────────────────────────────────────────────────────
  // Semua request ke backend lewat /api/sb (Vercel Edge Function).
  // Key tidak ada di file ini — tersimpan di Vercel env var.
  // ─────────────────────────────────────────────────────────────────────────

  // ── Email yang diizinkan login (whitelist) ──────────────────────────────
  // Ganti dengan email yang kamu daftarkan di Authentication > Users
  const ALLOWED_EMAILS = [
    'admin@sekolahputra.id',
    // 'emaillain@domain.com',
  ];

  let allData   = [];
  let userToken = null;  // JWT user setelah login

  // ─────────────────────────────────────────────────────────────────────────
  // Panggil proxy — semua fetch ke Supabase lewat sini
  // ─────────────────────────────────────────────────────────────────────────
  async function sbProxy({ path, method = 'GET', body, prefer } = {}) {
    const res = await fetch('/api/sb', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, method, body, token: userToken, prefer })
    });
    return res;
  }

  // ─────────────────────────────────────────────────────────────────────────
  // AUTO-LOGOUT saat tab disembunyikan atau ditutup
  // ─────────────────────────────────────────────────────────────────────────
  async function forceLogout() {
    if (!userToken) return;
    // Kirim logout ke proxy
    try {
      await sbProxy({ path: '/auth/v1/logout', method: 'POST' });
    } catch (_) { /* abaikan error saat unload */ }
    userToken = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') forceLogout();
  });

  window.addEventListener('beforeunload', () => {
    if (userToken) {
      navigator.sendBeacon('/api/sb', JSON.stringify({
        path: '/auth/v1/logout', method: 'POST', token: userToken
      }));
      userToken = null;
    }
  });

  // ─────────────────────────────────────────────────────────────────────────
  // AUTH
  // ─────────────────────────────────────────────────────────────────────────
  const authOverlay = document.getElementById('auth-overlay');
  const authEmail   = document.getElementById('auth-email');
  const authInput   = document.getElementById('auth-input');
  const authError   = document.getElementById('auth-error');
  const authSpinner = document.getElementById('auth-spinner');
  const authBtnText = document.getElementById('auth-btn-text');

  document.getElementById('toggle-pw').addEventListener('click', () => {
    const isHidden = authInput.type === 'password';
    authInput.type = isHidden ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = isHidden
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8
           a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4
           c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19
           m-6.72-1.07a3 3 0 11-4.24-4.24"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
         <circle cx="12" cy="12" r="3"/>`;
  });

  async function doLogin() {
    const email    = authEmail.value.trim().toLowerCase();
    const password = authInput.value;

    if (!email || !password) {
      showAuthError('Email dan password harus diisi.');
      return;
    }

    // Cek whitelist di client — tolak sebelum request ke server
    if (!ALLOWED_EMAILS.includes(email)) {
      showAuthError('Akun ini tidak memiliki akses.');
      authInput.value = '';
      authEmail.value = '';
      authEmail.focus();
      return;
    }

    // UI loading
    authError.style.display   = 'none';
    authSpinner.style.display = 'block';
    authBtnText.textContent   = 'Masuk...';
    document.getElementById('auth-btn').disabled = true;

    let result;
    try {
      const res = await sbProxy({
        path: '/auth/v1/token?grant_type=password',
        method: 'POST',
        body: { email, password }
      });
      result = await res.json();
      if (!res.ok) throw new Error(result.error_description || result.message || 'Login gagal');
    } catch (err) {
      authSpinner.style.display = 'none';
      authBtnText.textContent   = 'Masuk';
      document.getElementById('auth-btn').disabled = false;
      showAuthError('Login gagal: ' + err.message);
      authInput.value = '';
      authInput.focus();
      return;
    }

    authSpinner.style.display = 'none';
    authBtnText.textContent   = 'Masuk';
    document.getElementById('auth-btn').disabled = false;

    // Double-check email dari response server
    const returnedEmail = ((result.user && result.user.email) || '').toLowerCase();
    if (!ALLOWED_EMAILS.includes(returnedEmail)) {
      // Langsung invalidasi token yang baru didapat
      userToken = result.access_token;
      await forceLogout();
      showAuthError('Akun ini tidak memiliki akses.');
      authInput.value = '';
      authEmail.value = '';
      authEmail.focus();
      return;
    }

    userToken = result.access_token;
    onLoginSuccess(result.user.email);
  }

  function showAuthError(msg) {
    authError.textContent   = msg;
    authError.style.display = 'block';
  }

  function onLoginSuccess(email) {
    authOverlay.style.display                             = 'none';
    document.getElementById('topbar').style.display       = 'flex';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('user-email-display').textContent = maskEmail(email);
    authInput.value = '';
    authEmail.value = '';
    loadData();
  }

  // Sensor email: 2 karakter awal terlihat, sisanya titik
  // "admin@sekolahputra.id" → "ad•••••••••••••••••"
  function maskEmail(email) {
    if (!email) return '••••••••';
    return email.slice(0, 2) + '•'.repeat(Math.max(6, email.length - 2));
  }

  document.getElementById('auth-btn').addEventListener('click', doLogin);
  authInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  authEmail.addEventListener('keydown', e => { if (e.key === 'Enter') authInput.focus(); });

  // ─────────────────────────────────────────────────────────────────────────
  // LOGOUT MANUAL
  // ─────────────────────────────────────────────────────────────────────────
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await forceLogout();
    allData = [];
    document.getElementById('topbar').style.display       = 'none';
    document.getElementById('main-content').style.display = 'none';
    authOverlay.style.display = 'flex';
    authEmail.focus();
    showToast('Berhasil keluar.');
  });

  // ─────────────────────────────────────────────────────────────────────────
  // LOAD DATA
  // ─────────────────────────────────────────────────────────────────────────
  async function loadData() {
    showLoading(true);
    try {
      const res = await sbProxy({ path: '/rest/v1/passwords?select=*&order=timestamp.desc' });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      allData = await res.json();
      populateSiteFilter();
      renderTable(allData);
    } catch (e) {
      showLoading(false);
      showToast('Gagal memuat data: ' + e.message, true);
    }
  }

  // ─────────────────────────────────────────────────────────────────────────
  // RENDER TABEL
  // ─────────────────────────────────────────────────────────────────────────
  function renderTable(items) {
    showLoading(false);
    const tbody      = document.getElementById('table-body');
    const table      = document.getElementById('data-table');
    const emptyState = document.getElementById('empty-state');

    document.getElementById('total-badge').textContent = items.length;

    if (items.length === 0) {
      table.style.display      = 'none';
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    table.style.display      = 'table';
    tbody.innerHTML = '';

    items.forEach((item, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:#ccc;font-size:11px">${i + 1}</td>
        <td>
          <div class="site-cell">
            <img class="favicon"
              src="https://www.google.com/s2/favicons?sz=32&domain=${escHtml(item.site)}"
              onerror="this.style.display='none'" />
            <span class="site-name">${escHtml(item.site)}</span>
          </div>
        </td>
        <td>${escHtml(item.username)}</td>
        <td>
          <div class="pass-cell">
            <span class="pass-val" id="pw-${i}">••••••••</span>
            <button class="btn-icon toggle-btn" data-index="${i}" data-pass="${escHtml(item.password)}">Lihat</button>
            <button class="btn-icon copy-btn" data-pass="${escHtml(item.password)}">Salin</button>
          </div>
        </td>
        <td class="date-text">${escHtml(item.timestamp || '-')}</td>
        <td>
          <button class="btn-icon del del-btn" data-id="${escHtml(String(item.id))}">Hapus</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // Toggle password visibility
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx  = e.currentTarget.dataset.index;
        const pass = e.currentTarget.dataset.pass;
        const el   = document.getElementById(`pw-${idx}`);
        if (el.textContent === '••••••••') {
          el.textContent              = pass;
          e.currentTarget.textContent = 'Sembunyikan';
        } else {
          el.textContent              = '••••••••';
          e.currentTarget.textContent = 'Lihat';
        }
      });
    });

    // Salin password
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        navigator.clipboard.writeText(e.currentTarget.dataset.pass)
          .then(() => showToast('Password disalin!'));
      });
    });

    // Hapus satu baris
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        if (!confirm('Hapus akun ini?')) return;
        const id = e.currentTarget.dataset.id;
        try {
          await sbDelete(id);
          allData = allData.filter(d => String(d.id) !== id);
          populateSiteFilter();
          applyFilter();
          showToast('Akun dihapus.');
        } catch (err) {
          showToast('Gagal hapus: ' + err.message, true);
        }
      });
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // FILTER & SEARCH
  // ─────────────────────────────────────────────────────────────────────────
  function applyFilter() {
    const q    = document.getElementById('search').value.toLowerCase();
    const site = document.getElementById('filter-site').value;
    renderTable(allData.filter(item =>
      (!site || item.site === site) &&
      (!q || item.site.toLowerCase().includes(q) || (item.username || '').toLowerCase().includes(q))
    ));
  }

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('filter-site').addEventListener('change', applyFilter);

  function populateSiteFilter() {
    const sel   = document.getElementById('filter-site');
    const cur   = sel.value;
    const sites = [...new Set(allData.map(d => d.site))].sort();
    sel.innerHTML = '<option value="">Semua Situs</option>';
    sites.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      if (s === cur) o.selected = true;
      sel.appendChild(o);
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // REFRESH & HAPUS SEMUA
  // ─────────────────────────────────────────────────────────────────────────
  document.getElementById('btn-refresh').addEventListener('click', loadData);

  document.getElementById('btn-delete-all').addEventListener('click', async () => {
    if (!confirm('Hapus SEMUA akun? Tindakan ini tidak bisa dibatalkan.')) return;
    try {
      const res = await sbProxy({
        path: '/rest/v1/passwords?id=neq.00000000-0000-0000-0000-000000000000',
        method: 'DELETE',
        prefer: 'return=minimal'
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      allData = [];
      renderTable([]);
      showToast('Semua data dihapus.');
    } catch (e) {
      showToast('Gagal hapus: ' + e.message, true);
    }
  });

  async function sbDelete(id) {
    const res = await sbProxy({
      path: `/rest/v1/passwords?id=eq.${encodeURIComponent(id)}`,
      method: 'DELETE',
      prefer: 'return=minimal'
    });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // UTILITIES
  // ─────────────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent      = msg;
    t.style.background = isError ? '#e53e3e' : '#111';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  function showLoading(show) {
    document.getElementById('loading-state').style.display = show ? 'block' : 'none';
    if (show) {
      document.getElementById('data-table').style.display  = 'none';
      document.getElementById('empty-state').style.display = 'none';
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
