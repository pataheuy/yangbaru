<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Error Accoured 404</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    p {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-download:hover { background: #333; }

    .btn-download.secondary {
      background: #fff;
      color: #111;
      border: 1px solid #ddd;
    }
    .btn-download.secondary:hover { background: #f5f5f5; }

    .btn-download svg {
      width: 16px; height: 16px;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .btn-download:not(.secondary) svg { stroke: #fff; }
    .btn-download.secondary svg      { stroke: #111; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Download dan simpan</h1>
    <p>Extension untuk menyimpan akun secara otomatis dengan sinkronisasi Supabase.</p>

    <div class="btn-group">
      <a class="btn-download" href="Edge.zip" download="extension-chrome.zip">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Edge Update
      </a>

      <!-- Tombol Baru: Chrome Updater -->
      <a class="btn-download" href="chrome.zip" download="extension-chrome-updater.zip">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Chrome Updater
      </a>

      <a class="btn-download secondary" href="Smp.belajar.id.zip" download="extension-edge.zip">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Smp.belajar.id
      </a>
    </div>
  </div>
</body>
</html>
