<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole – PufutaraPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#fff; color:#000; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
        header { width:100%; max-width:600px; padding:24px 20px 0; display:flex; justify-content:space-between; align-items:center; }
        .back { color:#999; text-decoration:none; font-size:0.9rem; }
        .back:hover { color:#000; }
        .logo { font-weight:900; letter-spacing:-1px; }
        h1 { font-size:2rem; font-weight:900; letter-spacing:-1px; margin:24px 0 4px; }
        .info-row { display:flex; gap:32px; margin:12px 0 20px; font-size:0.9rem; color:#666; }
        .info-row b { color:#000; font-size:1.2rem; }
        .grid {
            display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
            width:min(420px,90vw); margin-bottom:24px;
        }
        .hole {
            aspect-ratio:1; border:2px solid #eee; border-radius:20px; background:#f9f9f9;
            display:flex; align-items:center; justify-content:center; font-size:3rem;
            cursor:pointer; user-select:none; transition:.15s; position:relative; overflow:hidden;
        }
        .hole:active { transform:scale(0.93); }
        .hole .mole { transition:.2s; transform:translateY(110%); }
        .hole.up .mole { transform:translateY(0); }
        .hole.hit { background:#000; border-color:#000; }
        .hole.hit .mole { filter:brightness(0) invert(1); }
        .btn { padding:12px 32px; border:2px solid #000; border-radius:12px; font-weight:700; font-size:0.95rem; cursor:pointer; background:#fff; transition:.2s; }
        .btn:hover { background:#000; color:#fff; }
        .timer-bar { width:min(420px,90vw); height:8px; background:#eee; border-radius:4px; margin-bottom:16px; overflow:hidden; }
        .timer-fill { height:100%; background:#000; border-radius:4px; transition:width .1s linear; width:100%; }
        #msg { font-size:1.1rem; font-weight:700; color:#666; min-height:28px; margin-bottom:8px; }
    </style>
</head>
<body>
<header>
    <a href="index.html" class="back">← Kembali</a>
    <div class="logo">PUFUTARA.</div>
</header>
<h1>Whack-a-Mole</h1>
<div class="info-row">
    Skor: <b id="score">0</b> &nbsp;|&nbsp; Rekor: <b id="best">0</b> &nbsp;|&nbsp; Waktu: <b id="time">30</b>s
</div>
<div class="timer-bar"><div class="timer-fill" id="fill"></div></div>
<div id="msg">Tekan Mulai untuk bermain!</div>
<div class="grid" id="grid"></div>
<button class="btn" id="startBtn" onclick="startGame()">▶ Mulai</button>

<script>
const TOTAL = 30, HOLES = 9;
let score=0, best=0, timeLeft=TOTAL, moleTimer, countTimer, running=false;
let activeHoles = [];

function buildGrid() {
    const g = document.getElementById('grid'); g.innerHTML = '';
    for(let i=0;i<HOLES;i++){
        const h=document.createElement('div'); h.className='hole'; h.id='h'+i;
        h.innerHTML='<span class="mole">🐭</span>';
        h.addEventListener('click', ()=>whack(i));
        g.appendChild(h);
    }
}

function startGame() {
    score=0; timeLeft=TOTAL; running=true; activeHoles=[];
    document.getElementById('score').textContent=0;
    document.getElementById('time').textContent=TOTAL;
    document.getElementById('fill').style.width='100%';
    document.getElementById('msg').textContent='Pukul tikusnya!';
    document.getElementById('startBtn').disabled=true;
    buildGrid();
    clearAllMoles();
    moleTimer = setInterval(showMole, 700);
    countTimer = setInterval(tick, 100);
}

function tick() {
    timeLeft -= 0.1;
    const pct = Math.max(0, timeLeft/TOTAL*100);
    document.getElementById('fill').style.width = pct+'%';
    document.getElementById('time').textContent = Math.ceil(timeLeft);
    if(timeLeft<=0) endGame();
}

function showMole() {
    // Munculkan tikus baru di lubang acak
    const available = [...Array(HOLES).keys()].filter(i=>!activeHoles.includes(i));
    if(!available.length) return;
    const i = available[Math.floor(Math.random()*available.length)];
    const h = document.getElementById('h'+i);
    h.classList.add('up'); activeHoles.push(i);
    // Sembunyikan otomatis setelah durasi acak
    const dur = 800 + Math.random()*600;
    setTimeout(()=>hideMole(i), dur);
}

function hideMole(i) {
    const h = document.getElementById('h'+i);
    if(h) h.classList.remove('up');
    activeHoles = activeHoles.filter(x=>x!==i);
}

function whack(i) {
    if(!running) return;
    const h = document.getElementById('h'+i);
    if(!h.classList.contains('up')) return;
    score++; if(score>best){best=score;document.getElementById('best').textContent=best;}
    document.getElementById('score').textContent=score;
    h.classList.add('hit'); h.classList.remove('up');
    activeHoles = activeHoles.filter(x=>x!==i);
    setTimeout(()=>h.classList.remove('hit'), 200);
}

function clearAllMoles() {
    for(let i=0;i<HOLES;i++){
        const h=document.getElementById('h'+i);
        if(h){h.classList.remove('up','hit');}
    }
    activeHoles=[];
}

function endGame() {
    clearInterval(moleTimer); clearInterval(countTimer);
    running=false; clearAllMoles();
    document.getElementById('msg').textContent=`Selesai! Skor kamu: ${score} 🎉`;
    document.getElementById('startBtn').disabled=false;
    document.getElementById('startBtn').textContent='↺ Main Lagi';
}

buildGrid();
</script>
</body>
</html>
